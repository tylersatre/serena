name: Vue Windows Debug

on: push

jobs:
  debug-vue-windows:
    name: Debug Vue tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install uv
        shell: bash
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Create virtual environment
        shell: bash
        run: uv venv

      - name: Install dependencies
        shell: bash
        run: uv pip install -e ".[dev]"

      - name: Run Vue tests with verbose output
        shell: bash
        run: uv run pytest -m vue -v -s --tb=long 2>&1
