name: Windows Vue Test Debug

on:
  push:  # Trigger on all pushes for fork development

concurrency:
  group: vue-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vue-test:
    name: Vue Tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install uv
        shell: bash
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Cache uv virtualenv
        uses: actions/cache@v3
        with:
          path: .venv
          key: uv-venv-Windows-3.11-${{ hashFiles('uv.lock') }}
      - name: Create virtual environment
        shell: bash
        run: |
          if [ ! -d ".venv" ]; then
            uv venv
          fi
      - name: Install dependencies
        shell: bash
        run: uv pip install -e ".[dev]"
      - name: Run TypeScript and Vue tests
        shell: bash
        run: uv run poe test -m "typescript or vue"
