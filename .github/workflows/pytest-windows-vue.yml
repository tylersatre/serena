name: Windows Vue Test Debug

on:
  push:  # Trigger on all pushes for fork development

concurrency:
  group: vue-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vue-test:
    name: Vue Tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install uv
        shell: bash
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Cache uv virtualenv
        uses: actions/cache@v3
        with:
          path: .venv
          key: uv-venv-Windows-3.11-${{ hashFiles('uv.lock') }}
      - name: Create virtual environment
        shell: bash
        run: |
          if [ ! -d ".venv" ]; then
            uv venv
          fi
      - name: Install dependencies
        shell: bash
        run: uv pip install -e ".[dev]"
      - name: Run TypeScript and Vue tests with verbose logging
        shell: bash
        env:
          # Enable verbose logging for debugging
          PYTHONUNBUFFERED: "1"
        run: |
          # Run tests with verbose output and capture all logs
          uv run pytest test -vv -s -m "typescript or vue" \
            --log-cli-level=DEBUG \
            --log-cli-format="%(asctime)s %(levelname)s %(name)s: %(message)s" \
            --tb=long \
            2>&1 | tee test-output.log

          # If test failed, show additional diagnostics
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo ""
            echo "=========================================="
            echo "TEST FAILED - Additional Diagnostics"
            echo "=========================================="
            echo ""
            echo "Node.js version:"
            node --version
            echo ""
            echo "npm version:"
            npm --version
            echo ""
            echo "Python version:"
            python --version
            echo ""
            echo "Contents of language servers directory:"
            ls -la ~/.serena/language_servers/ 2>/dev/null || echo "Directory does not exist"
            echo ""
            echo "Contents of Vue LSP directory:"
            ls -la ~/.serena/language_servers/vue-lsp/ 2>/dev/null || echo "Directory does not exist"
            echo ""
            echo "Contents of Vue LSP node_modules/.bin:"
            ls -la ~/.serena/language_servers/vue-lsp/node_modules/.bin/ 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
